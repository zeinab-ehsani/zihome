<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/node_modules/mdb-ui-kit/css/mdb.min.css">
    <link rel="stylesheet" href="./assets/scss/login.css">
    <title>login</title>


</head>

<body>
    <div class="mainlogin">

        <div class="top">
            <div class="d-flex align-middle justify-content-center g-1">
                <img class="me-1" src="./assets/img/login-img/logo.svg">
                <p>زیبایی به سبک</p>
            </div>
            <p class="text-center mt-1">متنوع ترین کالکشن خانه و آشپزخانه و دکوراسیون</p>
        </div>
        <div class="login">
            <span>ورود | ثبت نام</span>
            <span class="mt-3">درود</span>
            <span>
                <label for="phone">لطفاشماره موبایل خودراواردکنید</label>
                <br>
                <input id="phone" type="tel" placeholder="091234567">
            </span>
            <button>تایید</button>
            <span>
                <span>
                    باورودبه
                </span>
                <a>زی هوم،</a>
                <span>شماشرایط استفاده و</span>
                <a>قوانین‌حریم خصوصی</a>
                <span>


                    مارامی پذیرید</span>
            </span>
        </div>






        <div class="password-login " dir="rtl">

            <h class=" font16 mb-4">
                ورود با رمز عبور
            </h>

            <form>
                <div class="password-form font14 mb-4 mt-4">
                    <label for="password" class="form-label font14 ">
                        رمز عبور خود را وارد کنید
                    </label>

                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control password password-input" placeholder="">

                        </button>
                    </div>
                </div>

                <div class="password-actions">

                    <a href="#" class="password-action font12">
                        ورود با رمز یکبار مصرف
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <br>

                    <a href="#" class="password-action font12">
                        فراموشی رمز عبور
                        <i class="fas fa-chevron-left"></i>
                    </a>

                </div>

                <button type="submit" class="btn mt-4 text-light w-100 font16 bg-color submit-btn rounded-3 py-3">
                    تایید
                </button>

            </form>

        </div>


    </div>

    <!-- start -->






</body>

</html>
